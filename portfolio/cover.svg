<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211d18"/>
      <stop offset="1" stop-color="#17140f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 168.75 H1200 M0 337.5 H1200 M0 506.25 H1200"/>
    <path d="M300 0 V675 M600 0 V675 M900 0 V675"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="300" font-size="104" font-weight="700" fill="#f2ede4" letter-spacing="1">tallywick</text>
  <text x="100" y="360" font-size="30" fill="#7ac898" letter-spacing="2">SELF HOSTED HIT COUNTER</text>

  <!-- rising bars, a counter motif -->
  <g fill="#7ac898" fill-opacity="0.85">
    <rect x="100" y="470" width="34" height="60" rx="3"/>
    <rect x="150" y="440" width="34" height="90" rx="3"/>
    <rect x="200" y="452" width="34" height="78" rx="3"/>
    <rect x="250" y="410" width="34" height="120" rx="3"/>
    <rect x="300" y="386" width="34" height="144" rx="3"/>
    <rect x="350" y="352" width="34" height="178" rx="3"/>
  </g>

  <!-- flat badge -->
  <g transform="translate(96 560)">
    <rect width="150" height="40" rx="6" fill="#555"/>
    <rect x="150" width="120" height="40" rx="6" fill="#4c1"/>
    <rect x="140" width="20" height="40" fill="#4c1"/>
    <text x="75" y="26" font-size="20" fill="#fff" text-anchor="middle">views</text>
    <text x="210" y="26" font-size="20" fill="#fff" text-anchor="middle">1.2k</text>
  </g>

  <!-- endpoint line -->
  <text x="1104" y="610" font-size="24" fill="#8a8175" text-anchor="end">GET /v1/hit/:namespace/:key</text>

  <!-- corner tag -->
  <text x="1104" y="72" font-size="22" fill="#8a8175" text-anchor="end">Deno KV · Durable Objects</text>
</svg>
