name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check core/ adapters/deno/ test/ client/
      - run: deno lint core/ adapters/deno/ test/
      - run: deno check core/ adapters/deno/ test/
      - run: deno task test

  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run
